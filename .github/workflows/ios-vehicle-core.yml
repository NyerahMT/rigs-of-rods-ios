name: iOS vehicle core

on:
  push:
    branches: [ ios-port ]
    paths:
      - 'source/main/physics/ApproxMath.h'
      - 'source/main/physics/BeamPhysics.*'
      - 'source/main/physics/Differentials.*'
      - 'source/main/physics/HydroPhysics.*'
      - 'source/main/physics/WheelPhysics.*'
      - 'source/main/physics/SimConstants.h'
      - 'source/main/physics/collision/GroundContact.*'
      - 'source/main/physics/collision/GroundFriction.*'
      - 'source/main/resources/rig_def_fileformat/PortableRigDef.*'
      - 'platform/ios/vehicle-core/**'
      - 'platform/ios/app/**'
      - '.github/workflows/ios-vehicle-core.yml'
  pull_request:
    paths:
      - 'source/main/physics/ApproxMath.h'
      - 'source/main/physics/BeamPhysics.*'
      - 'source/main/physics/Differentials.*'
      - 'source/main/physics/HydroPhysics.*'
      - 'source/main/physics/WheelPhysics.*'
      - 'source/main/physics/SimConstants.h'
      - 'source/main/physics/collision/GroundContact.*'
      - 'source/main/physics/collision/GroundFriction.*'
      - 'source/main/resources/rig_def_fileformat/PortableRigDef.*'
      - 'platform/ios/vehicle-core/**'
      - 'platform/ios/app/**'
      - '.github/workflows/ios-vehicle-core.yml'
  workflow_dispatch:

jobs:
  vehicle-core:
    name: RoR vehicle physics / iPhone ARM64
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang++ --version

      - name: Verify pinned authored fixture
        run: |
          test -s platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck
          grep -q '^Daf Semi truck$' platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck
          grep -q '10000.0,  0.0, b6b0UID-tracks/semi' platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck

      - name: Build and run native behavior probes
        run: |
          cmake \
            -S platform/ios/vehicle-core \
            -B build/vehicle-core-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON
          cmake --build build/vehicle-core-native --config Release
          ctest --test-dir build/vehicle-core-native --output-on-failure

      - name: Cross-compile RoR vehicle physics for iPhone
        run: |
          cmake \
            -S platform/ios/vehicle-core \
            -B build/vehicle-core-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build/vehicle-core-ios --config Release

      - name: Verify iPhone vehicle-core artifact
        run: |
          LIB=$(find build/vehicle-core-ios -name 'libror_vehicle_core.a' -print -quit)
          test -n "$LIB"
          echo "Built: $LIB"
          file "$LIB"
          lipo -info "$LIB"
          xcrun --sdk iphoneos nm -gU "$LIB" | grep -E 'Calc(Open|Viscous|Locked|Separate)Diff|Calc(Static|Stribeck)FrictionScale|CalcBeamStress|ApplyBeamForce|IntegrateNode|CalcGroundContact|ApplyFlatGroundContact|CalcWheelBrakeTorque|StepWheelNodes|ApplyWheelReactionTorque|StepHydroSteeringState|CalcHydroTargetLength' || true

      - name: Build unsigned authored-vehicle iPhone IPA
        run: |
          platform/ios/app/build-ipa.sh build/vehicle-core-ios build/ios-app

      - name: Verify IPA bundle and authored truck
        run: |
          test -f build/ios-app/RoRIOSProbe.ipa
          rm -rf build/ipa-verify
          mkdir -p build/ipa-verify
          unzip -q build/ios-app/RoRIOSProbe.ipa -d build/ipa-verify
          test -f build/ipa-verify/Payload/RoRIOSProbe.app/RoRIOSProbe
          test -f build/ipa-verify/Payload/RoRIOSProbe.app/Info.plist
          test -s build/ipa-verify/Payload/RoRIOSProbe.app/Content/dafsemi/b6b0UID-semi.truck
          grep -q '^Daf Semi truck$' build/ipa-verify/Payload/RoRIOSProbe.app/Content/dafsemi/b6b0UID-semi.truck
          file build/ipa-verify/Payload/RoRIOSProbe.app/RoRIOSProbe
          lipo -info build/ipa-verify/Payload/RoRIOSProbe.app/RoRIOSProbe
          plutil -lint build/ipa-verify/Payload/RoRIOSProbe.app/Info.plist
          du -h build/ios-app/RoRIOSProbe.ipa

      - name: Upload unsigned authored-vehicle iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: ror-ios-authored-vehicle-ipa
          path: build/ios-app/RoRIOSProbe.ipa
          if-no-files-found: error

      - name: Upload iPhone vehicle-core library
        uses: actions/upload-artifact@v4
        with:
          name: ror-vehicle-core-ios-arm64
          path: build/vehicle-core-ios/**/libror_vehicle_core.a
          if-no-files-found: error
