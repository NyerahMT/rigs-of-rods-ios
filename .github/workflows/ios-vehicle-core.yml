name: iOS vehicle core
on:
  push:
    branches: [ ios-port ]
    paths: ['source/main/physics/**','source/main/resources/rig_def_fileformat/**','platform/ios/**','.github/workflows/ios-vehicle-core.yml']
  pull_request:
    paths: ['source/main/physics/**','source/main/resources/rig_def_fileformat/**','platform/ios/**','.github/workflows/ios-vehicle-core.yml']
  workflow_dispatch:
jobs:
  vehicle-core:
    name: RoR physics + OGRE Metal game view / iPhone ARM64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Restore complete authored runtime and apply parity layer
        run: |
          git show 20e3ce1299bad39f397fac7fe414e699cf9bad81:platform/ios/vehicle-core/AuthoredVehicleRuntime.cpp > platform/ios/vehicle-core/AuthoredVehicleRuntime.cpp
          python3 platform/ios/vehicle-core/apply_runtime_mass_parity.py platform/ios/vehicle-core/AuthoredVehicleRuntime.cpp
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          clang++ --version
      - name: Verify pinned authored fixture
        run: |
          test -s platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck
          grep -q '^Daf Semi truck$' platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck
      - name: Build and run native conformance probes
        run: |
          cmake -S platform/ios/vehicle-core -B build/vehicle-core-native -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/vehicle-core-native --config Release
          ctest --test-dir build/vehicle-core-native --output-on-failure
      - name: Fetch fast archived RoR reference car
        run: bash platform/ios/app/fetch-gabester-bandit.sh build/gabester-bandit-resource
      - name: Exercise Bandit 400 GT reference car
        run: |
          TARGET=build/gabester-bandit-resource/extracted/gavrilbandit400GT.truck
          test -s "$TARGET"
          echo "Fast reference target: $TARGET"
          echo '--- header / engine ---'
          nl -ba "$TARGET" | sed -n '1,110p'
          echo '--- nodes to beams boundary ---'
          nl -ba "$TARGET" | sed -n '510,575p'
          echo '--- wheel / suspension area ---'
          nl -ba "$TARGET" | sed -n '5425,5505p'
          echo '--- physics-relevant sections ---'
          grep -Ein '^[[:space:]]*(globals|nodes2?|beams|shocks[23]?|hydros|wheels2?|meshwheels2?|flexbodywheels|engine|engoption|brakes|axles|interaxles|detacher_group|set_node_defaults|set_beam_defaults|set_beam_defaults_scale|minimass|set_default_minimass)([[:space:]]|$)' "$TARGET" || true
          build/vehicle-core-native/ror_authored_vehicle_smoke "$TARGET"
      - name: Verify authored OGRE visual extraction
        run: |
          mkdir -p build/ogre-visual-probe
          clang++ -std=c++17 -O2 -Isource/main/resources/rig_def_fileformat -Iplatform/ios/ogre platform/ios/ogre/AuthoredVisualGeometry.cpp source/main/resources/rig_def_fileformat/PortableRigDef.cpp platform/ios/ogre/VisualGeometryProbe.cpp -o build/ogre-visual-probe/visual_geometry_probe
          build/ogre-visual-probe/visual_geometry_probe platform/ios/vehicle-core/fixtures/dafsemi/b6b0UID-semi.truck
      - name: Cross-compile vehicle core for iPhone
        run: |
          cmake -S platform/ios/vehicle-core -B build/vehicle-core-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/vehicle-core-ios --config Release
      - name: Build pinned OGRE 14 Metal for iPhone
        run: bash platform/ios/ogre/build-ogre-ios.sh
      - name: Cross-compile upstream RoR RigDef for iPhone
        run: bash platform/ios/ror-native/build-rigdef-ios.sh build/ror-native-rigdef-ios
      - name: Build unsigned OGRE game-view iPhone IPA
        run: platform/ios/app/build-ipa.sh build/vehicle-core-ios build/ios-app build/ogre-ios
      - name: Package Bandit 400 GT control vehicle
        run: |
          APP=build/ios-app/Payload/RoRIOSProbe.app
          BANDIT=build/gabester-bandit-resource/extracted
          DST="$APP/Content/bandit"
          test -s "$BANDIT/gavrilbandit400GT.truck"
          mkdir -p "$DST"
          cp -R "$BANDIT/." "$DST/"
          cp "$BANDIT/gavrilbandit400GT.truck" "$DST/Bandit.truck"
          test -s "$DST/Bandit.truck"
          grep -q '^Gavril Bandit 400 GT$' "$DST/Bandit.truck"

          # Archived RoR packs mix DXT with old 24-bit and 32-bit RGB DDS files.
          # Canonical BGRA8 can stay untouched; every other RGB/DXT texture that
          # our converter understands is rewritten to the same iOS-safe layout.
          python3 - "$DST" platform/ios/ogre/transcode_dxt_dds_for_ios.py <<'PY'
          from pathlib import Path
          import struct
          import subprocess
          import sys
          root = Path(sys.argv[1])
          transcoder = Path(sys.argv[2])
          canonical_masks = (0x00FF0000, 0x0000FF00, 0x000000FF, 0xFF000000)
          converted = 0
          skipped_other = 0
          for path in sorted(root.rglob('*.dds')):
              header = path.read_bytes()[:128]
              if len(header) < 128 or header[:4] != b'DDS ':
                  continue
              flags = struct.unpack_from('<I', header, 80)[0]
              fourcc = header[84:88]
              bpp = struct.unpack_from('<I', header, 88)[0]
              masks = tuple(struct.unpack_from('<I', header, o)[0] for o in (92,96,100,104))
              canonical = fourcc == b'\0\0\0\0' and bpp == 32 and masks == canonical_masks
              if canonical:
                  continue
              supported = fourcc in {b'DXT1', b'DXT3', b'DXT5'} or ((flags & 0x40) and bpp in {16,24,32})
              if not supported:
                  print(f'Leaving unsupported non-diffuse DDS untouched: {path.name} flags=0x{flags:x} bpp={bpp} fourcc={fourcc!r}')
                  skipped_other += 1
                  continue
              temp = path.with_name(path.name + '.bgra8')
              subprocess.check_call([sys.executable, str(transcoder), str(path), str(temp)])
              temp.replace(path)
              converted += 1
          print(f'Bandit iOS DDS normalized: {converted}; unsupported auxiliary maps left untouched: {skipped_other}')
          if converted == 0:
              raise SystemExit('expected the archived Bandit pack to contain legacy RGB/DXT diffuse textures')
          PY

          # The iOS audio bridge consumes the vehicle's actual soundscript and GT
          # recordings; these checks keep a silent package from reaching device.
          test -s "$DST/gavrilbandit.soundscript"
          test -s "$DST/banditv8GTidle.wav"
          test -s "$DST/banditv8GTmed.wav"
          test -s "$DST/banditstart.wav"
          grep -q 'banditv8GTEngineAcc' "$DST/Bandit.truck"
          grep -q 'banditStarter' "$DST/Bandit.truck"

          # Every diffuse map referenced by the GT's managedmaterials section must
          # be canonical BGRA8 before the Metal app reaches the device.
          python3 - "$DST" <<'PY'
          from pathlib import Path
          import struct
          import sys
          root = Path(sys.argv[1])
          names = [
              'gavrilbanditGT.dds', 'burnwheelband.dds', 'gavrilinvis.dds',
              'banditwheelGT.dds', 'banditV8.dds', 'banditglass.dds',
              'banditintglass.dds', 'banditinterior.dds', 'banditsteerGT.dds'
          ]
          expected_masks = (0x00FF0000,0x0000FF00,0x000000FF,0xFF000000)
          for name in names:
              path = root / name
              data = path.read_bytes()[:128]
              assert data[:4] == b'DDS ', path
              assert data[84:88] == b'\0\0\0\0', f'{name}: still FourCC compressed'
              assert struct.unpack_from('<I', data, 88)[0] == 32, f'{name}: not BGRA8'
              masks = tuple(struct.unpack_from('<I', data, o)[0] for o in (92,96,100,104))
              assert masks == expected_masks, f'{name}: non-canonical channel masks {masks}'
          print(f'Bandit managed-material diffuse textures verified: {len(names)}')
          PY

          rm -f build/ios-app/RoRIOSProbe.ipa
          (cd build/ios-app && zip -qry RoRIOSProbe.ipa Payload)
      - name: Verify OGRE IPA bundle
        run: |
          test -f build/ios-app/RoRIOSProbe.ipa
          rm -rf build/ipa-verify && mkdir -p build/ipa-verify
          unzip -q build/ios-app/RoRIOSProbe.ipa -d build/ipa-verify
          APP=build/ipa-verify/Payload/RoRIOSProbe.app
          test -f "$APP/RoRIOSProbe"
          lipo -info "$APP/RoRIOSProbe" | grep -q arm64
          plutil -lint "$APP/Info.plist"
          test -s "$APP/Content/bandit/Bandit.truck"
          grep -q '^Gavril Bandit 400 GT$' "$APP/Content/bandit/Bandit.truck"
          test -s "$APP/Content/bandit/gavrilbandit.soundscript"
          test -s "$APP/Content/bandit/banditv8GTidle.wav"
          test -s "$APP/Content/bandit/banditv8GTmed.wav"
          test -s "$APP/Content/bandit/banditstart.wav"
      - name: Upload unsigned OGRE game-view iPhone IPA
        uses: actions/upload-artifact@v4
        with: { name: ror-ios-ogre-gameview-ipa, path: build/ios-app/RoRIOSProbe.ipa, if-no-files-found: error }
      - name: Upload iPhone vehicle-core library
        uses: actions/upload-artifact@v4
        with: { name: ror-vehicle-core-ios-arm64, path: 'build/vehicle-core-ios/**/libror_vehicle_core.a', if-no-files-found: error }
      - name: Upload native RoR RigDef library
        uses: actions/upload-artifact@v4
        with: { name: ror-native-rigdef-ios-arm64, path: build/ror-native-rigdef-ios/libror_native_rigdef.a, if-no-files-found: error }
